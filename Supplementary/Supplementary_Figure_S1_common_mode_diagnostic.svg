<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-label="Supplementary Figure S1 common-mode pressure diagnostic">
  <rect width="1600" height="1100" fill="#ffffff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#4b5563}.panelTitle{font-size:20px;font-weight:700}.axisLabel{font-size:15px;fill:#374151}.tick{font-size:13px;fill:#4b5563}.small{font-size:13px;fill:#4b5563}.note{font-size:15px;fill:#374151}.bold{font-weight:700}.caption{font-size:14px;fill:#4b5563}.axis{stroke:#374151;stroke-width:1.4}.grid{stroke:#e5e7eb;stroke-width:1}.threshold{stroke:#9b1c31;stroke-width:2;stroke-dasharray:6 5}.box{fill:#f8fafc;stroke:#d1d5db;stroke-width:1.3;rx:14}.callout{fill:#fff7ed;stroke:#d08c28;stroke-width:1.4;rx:12}.legendText{font-size:14px;fill:#374151}.top{fill:#d08c28}.bottom{fill:#2f6fb0}.neutral{fill:#64748b}.warning{fill:#9b1c31}.lineTop{stroke:#d08c28}.lineBottom{stroke:#2f6fb0}.lineNeutral{stroke:#64748b}
  </style>

  <text x="60" y="52" class="title">Supplementary Figure S1. Common-mode diagnostic for the main-trial pressure endpoint</text>
  <text x="60" y="82" class="subtitle">Purpose: show why the pressure result is retained as exploratory after checking for shared absolute-pressure structure.</text>

  <rect x="60" y="110" width="1480" height="78" class="callout"/>
  <text x="86" y="142" class="note bold">How to read this figure</text>
  <text x="86" y="168" class="note">Panel A shows that all usable pressure traces shared a strong common-mode component. Panel B shows that the uncorrected peak-position endpoint is detectable, but the common-mode residual endpoint is not. Panel C shows leave-one-out robustness of the uncorrected endpoint.</text>

  <g id="legend">
    <text x="1050" y="52" class="legendText bold">Legend</text>
    <rect x="1115" y="39" width="16" height="16" class="top"/><text x="1138" y="52" class="legendText">Top-position sensor</text>
    <rect x="1290" y="39" width="16" height="16" class="bottom"/><text x="1313" y="52" class="legendText">Bottom-position sensor</text>
    <line x1="1115" y1="72" x2="1155" y2="72" class="threshold"/><text x="1164" y="77" class="legendText">p = 0.05 reference</text>
  </g>

  <!-- Panel A -->
  <rect x="60" y="220" width="1480" height="390" class="box"/>
  <text x="90" y="257" class="panelTitle">(A) Correlation with the leave-one-out common-mode trace</text>
  <text x="90" y="284" class="caption">Each bar is one sensor. Values close to 1 mean that the sensor trace followed the shared pressure pattern seen across the other sensors.</text>

  <!-- x-axis Panel A -->
  <line x1="510" y1="552" x2="1320" y2="552" class="axis"/>
  <line x1="510" y1="300" x2="510" y2="552" class="axis"/>
  <line x1="510" y1="300" x2="510" y2="557" class="grid"/><text x="510" y="577" text-anchor="middle" class="tick">0.85</text>
  <line x1="780" y1="300" x2="780" y2="557" class="grid"/><text x="780" y="577" text-anchor="middle" class="tick">0.90</text>
  <line x1="1050" y1="300" x2="1050" y2="557" class="grid"/><text x="1050" y="577" text-anchor="middle" class="tick">0.95</text>
  <line x1="1320" y1="300" x2="1320" y2="557" class="grid"/><text x="1320" y="577" text-anchor="middle" class="tick">1.00</text>
  <text x="915" y="600" text-anchor="middle" class="axisLabel">Leave-one-out correlation with common-mode trace (r)</text>

  <!-- Panel A rows sorted ascending -->
  <text x="105" y="330" class="small">V56 | Bottom | C50</text><rect x="510" y="314" width="49" height="18" class="bottom"/><text x="570" y="329" class="small">0.859</text>
  <text x="105" y="352" class="small">V71 | Top | C50</text><rect x="510" y="336" width="118" height="18" class="top"/><text x="640" y="351" class="small">0.872</text>
  <text x="105" y="374" class="small">V58 | Top | C19</text><rect x="510" y="358" width="344" height="18" class="top"/><text x="866" y="373" class="small">0.914</text>
  <text x="105" y="396" class="small">V52 | Bottom | C50</text><rect x="510" y="380" width="489" height="18" class="bottom"/><text x="1011" y="395" class="small">0.941</text>
  <text x="105" y="418" class="small">V53 | Top | C50</text><rect x="510" y="402" width="556" height="18" class="top"/><text x="1078" y="417" class="small">0.953</text>
  <text x="105" y="440" class="small">V57 | Top | C19</text><rect x="510" y="424" width="559" height="18" class="top"/><text x="1081" y="439" class="small">0.954</text>
  <text x="105" y="462" class="small">V55 | Top | C19</text><rect x="510" y="446" width="585" height="18" class="top"/><text x="1107" y="461" class="small">0.958</text>
  <text x="105" y="484" class="small">V70 | Bottom | C50</text><rect x="510" y="468" width="587" height="18" class="bottom"/><text x="1109" y="483" class="small">0.959</text>
  <text x="105" y="506" class="small">V51 | Bottom | C19</text><rect x="510" y="490" width="592" height="18" class="bottom"/><text x="1114" y="505" class="small">0.960</text>
  <text x="105" y="528" class="small">V50 | Top | C50</text><rect x="510" y="512" width="610" height="18" class="top"/><text x="1132" y="527" class="small">0.963</text>
  <text x="105" y="550" class="small">V59 | Bottom | C19</text><rect x="510" y="534" width="663" height="18" class="bottom"/><text x="1185" y="549" class="small">0.973</text>

  <rect x="1210" y="318" width="275" height="112" fill="#ffffff" stroke="#d1d5db" rx="10"/>
  <text x="1232" y="348" class="note bold">Panel A summary</text>
  <text x="1232" y="376" class="note">mean r = 0.937</text>
  <text x="1232" y="402" class="note">range = 0.859–0.973</text>
  <text x="1232" y="426" class="small">11 usable sensor traces</text>

  <!-- Panel B -->
  <rect x="60" y="640" width="700" height="330" class="box"/>
  <text x="90" y="678" class="panelTitle">(B) Position term: original endpoint vs common-mode residual</text>
  <text x="90" y="705" class="caption">Same pressure question, but after removing the shared component from each sensor trace.</text>
  <line x1="170" y1="880" x2="690" y2="880" class="axis"/>
  <line x1="170" y1="752" x2="170" y2="880" class="axis"/>
  <line x1="170" y1="752" x2="170" y2="885" class="grid"/><text x="170" y="905" text-anchor="middle" class="tick">0</text>
  <line x1="387" y1="752" x2="387" y2="890" class="threshold"/><text x="397" y="768" class="small">p = 0.05</text>
  <line x1="603" y1="752" x2="603" y2="885" class="grid"/><text x="603" y="905" text-anchor="middle" class="tick">0.10</text>
  <line x1="690" y1="752" x2="690" y2="885" class="grid"/><text x="690" y="905" text-anchor="middle" class="tick">0.12</text>
  <text x="430" y="940" text-anchor="middle" class="axisLabel">ANOVA p-value for position term</text>

  <text x="96" y="790" class="note">Uncorrected peak ΔP</text>
  <line x1="170" y1="815" x2="244" y2="815" stroke="#2f6fb0" stroke-width="13" stroke-linecap="round"/>
  <circle cx="244" cy="815" r="8" class="bottom"/>
  <text x="260" y="820" class="note bold">p = 0.017</text>
  <text x="355" y="820" class="small">F(1,8) = 9.14; bottom &gt; top at peak</text>

  <text x="96" y="850" class="note">Common-mode residual peak</text>
  <line x1="170" y1="870" x2="652" y2="870" stroke="#d08c28" stroke-width="13" stroke-linecap="round"/>
  <circle cx="652" cy="870" r="8" class="top"/>
  <text x="668" y="875" class="note bold">p = 0.111</text>
  <text x="355" y="898" class="small">F(1,8) = 3.21; position term not statistically detectable</text>

  <!-- Panel C -->
  <rect x="790" y="640" width="750" height="330" class="box"/>
  <text x="820" y="678" class="panelTitle">(C) Leave-one-out robustness of uncorrected peak endpoint</text>
  <text x="820" y="705" class="caption">Each dot is the position-effect p-value after omitting one sensor. One omission crosses the 0.05 reference.</text>
  <line x1="900" y1="840" x2="1450" y2="840" class="axis"/>
  <line x1="900" y1="760" x2="900" y2="845" class="grid"/><text x="900" y="865" text-anchor="middle" class="tick">0</text>
  <line x1="1358" y1="760" x2="1358" y2="850" class="threshold"/><text x="1368" y="776" class="small">p = 0.05</text>
  <line x1="1450" y1="760" x2="1450" y2="845" class="grid"/><text x="1450" y="865" text-anchor="middle" class="tick">0.06</text>
  <text x="1175" y="900" text-anchor="middle" class="axisLabel">p-value after omitting one sensor</text>

  <!-- sorted leave-one-out dots on a single readable strip -->
  <circle cx="906" cy="840" r="6" class="neutral"/><circle cx="984" cy="840" r="6" class="neutral"/><circle cx="1124" cy="840" r="6" class="neutral"/><circle cx="1163" cy="840" r="6" class="neutral"/><circle cx="1208" cy="840" r="6" class="neutral"/><circle cx="1211" cy="840" r="6" class="neutral"/><circle cx="1211" cy="820" r="6" class="neutral"/><circle cx="1260" cy="840" r="6" class="neutral"/><circle cx="1264" cy="840" r="6" class="neutral"/><circle cx="1267" cy="820" r="6" class="neutral"/><circle cx="1368" cy="840" r="7" class="warning"/>
  <text x="905" y="790" class="small">min 0.0007</text>
  <text x="1318" y="800" class="small">max 0.0511</text>
  <line x1="1344" y1="804" x2="1368" y2="832" stroke="#9b1c31" stroke-width="1"/>

  <rect x="820" y="922" width="675" height="32" fill="#ffffff" stroke="#d1d5db" rx="8"/>
  <text x="840" y="944" class="note"><tspan class="bold">Interpretation:</tspan> the uncorrected endpoint is reproducible, but the common-mode check weakens a definitive mechanics claim.</text>

  <text x="60" y="1042" class="caption">Notes: C19 and C50 are chamber set-point labels, not measured wine temperatures. The figure uses original main-trial sensor records and internal diagnostics only; no external barometric correction was performed because absolute trial dates were not recoverable.</text>
  <text x="60" y="1068" class="caption">Source diagnostics: pressure_common_mode_correlations.csv, pressure_common_mode_peak_anova.csv, pressure_leave_one_out.csv and go_no_go_audit.py.</text>
</svg>

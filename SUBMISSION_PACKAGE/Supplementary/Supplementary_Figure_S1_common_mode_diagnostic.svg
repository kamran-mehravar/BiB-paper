<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-label="Supplementary Figure S1 common-mode pressure diagnostic">
<rect width="1500" height="1120" fill="#ffffff"/>
<style>
text{font-family:'Times New Roman',Times,serif;fill:#1b1b1b}.title{font-size:30px;font-weight:bold}.subtitle{font-size:19px;fill:#333}.panel{font-size:22px;font-weight:bold}.label{font-size:17px}.tick{font-size:15px}.small{font-size:15px;fill:#333}.axis{stroke:#1b1b1b;stroke-width:1.6}.grid{stroke:#d8d8d8;stroke-width:1}.box{fill:#fff;stroke:#b8b8b8;stroke-width:1.4}.ref{stroke:#8b1f2d;stroke-width:2;stroke-dasharray:7 6}.c19t{fill:#7e3f44}.c19b{fill:#b7904f}.c50t{fill:#304d63}.c50b{fill:#6e7f47}.dot{stroke:#1b1b1b;stroke-width:.7}.bar{stroke:#1b1b1b;stroke-width:.8}.legend{font-size:16px}
</style>
<text x="45" y="45" class="title">Supplementary Figure S1. Common-mode diagnostic for the main-trial pressure endpoint</text>
<text x="45" y="77" class="subtitle">C19 and C50 denote chamber set-point labels. The figure summarises why the pressure endpoint is reported as exploratory.</text>

<!-- Legends -->
<rect x="805" y="102" width="22" height="14" class="c19t"/><text x="835" y="115" class="legend">C19 top</text>
<rect x="945" y="102" width="22" height="14" class="c19b"/><text x="975" y="115" class="legend">C19 bottom</text>
<rect x="1115" y="102" width="22" height="14" class="c50t"/><text x="1145" y="115" class="legend">C50 top</text>
<rect x="1260" y="102" width="22" height="14" class="c50b"/><text x="1290" y="115" class="legend">C50 bottom</text>

<!-- Panel A box -->
<rect x="50" y="135" width="1400" height="365" class="box"/>
<text x="85" y="174" class="panel">(A) Correlation of each usable pressure trace with the common-mode trace</text>
<text x="116" y="472" class="label">Usable sensor trace</text>
<text x="650" y="472" class="label">Leave-one-out correlation with common-mode trace, r</text>
<line x1="250" y1="430" x2="1370" y2="430" class="axis"/>
<line x1="250" y1="200" x2="250" y2="430" class="axis"/>
<line x1="250" y1="200" x2="250" y2="430" class="grid"/><text x="250" y="452" class="tick" text-anchor="middle">0.84</text>
<line x1="530" y1="200" x2="530" y2="430" class="grid"/><text x="530" y="452" class="tick" text-anchor="middle">0.88</text>
<line x1="810" y1="200" x2="810" y2="430" class="grid"/><text x="810" y="452" class="tick" text-anchor="middle">0.92</text>
<line x1="1090" y1="200" x2="1090" y2="430" class="grid"/><text x="1090" y="452" class="tick" text-anchor="middle">0.96</text>
<line x1="1370" y1="200" x2="1370" y2="430" class="grid"/><text x="1370" y="452" class="tick" text-anchor="middle">1.00</text>
<text x="235" y="218" text-anchor="end" class="tick">V56 (C50 bottom)</text><rect x="250" y="205" width="133" height="18" rx="9" class="c50b bar"/>
<text x="235" y="238" text-anchor="end" class="tick">V71 (C50 top)</text><rect x="250" y="225" width="224" height="18" rx="9" class="c50t bar"/>
<text x="235" y="258" text-anchor="end" class="tick">V58 (C19 top)</text><rect x="250" y="245" width="516" height="18" rx="9" class="c19t bar"/>
<text x="235" y="278" text-anchor="end" class="tick">V52 (C50 bottom)</text><rect x="250" y="265" width="704" height="18" rx="9" class="c50b bar"/>
<text x="235" y="298" text-anchor="end" class="tick">V53 (C50 top)</text><rect x="250" y="285" width="791" height="18" rx="9" class="c50t bar"/>
<text x="235" y="318" text-anchor="end" class="tick">V57 (C19 top)</text><rect x="250" y="305" width="795" height="18" rx="9" class="c19t bar"/>
<text x="235" y="338" text-anchor="end" class="tick">V55 (C19 top)</text><rect x="250" y="325" width="829" height="18" rx="9" class="c19t bar"/>
<text x="235" y="358" text-anchor="end" class="tick">V70 (C50 bottom)</text><rect x="250" y="345" width="831" height="18" rx="9" class="c50b bar"/>
<text x="235" y="378" text-anchor="end" class="tick">V51 (C19 bottom)</text><rect x="250" y="365" width="839" height="18" rx="9" class="c19b bar"/>
<text x="235" y="398" text-anchor="end" class="tick">V50 (C50 top)</text><rect x="250" y="385" width="864" height="18" rx="9" class="c50t bar"/>
<text x="235" y="418" text-anchor="end" class="tick">V59 (C19 bottom)</text><rect x="250" y="405" width="929" height="18" rx="9" class="c19b bar"/>
<rect x="1170" y="218" width="190" height="58" fill="#fff" stroke="#b8b8b8"/><text x="1265" y="241" text-anchor="middle" class="small">mean r = 0.937</text><text x="1265" y="263" text-anchor="middle" class="small">range 0.859–0.973</text>

<!-- Panel B box -->
<rect x="50" y="540" width="1400" height="245" class="box"/>
<text x="85" y="580" class="panel">(B) Position-term p-value before and after common-mode residualisation</text>
<text x="85" y="750" class="small">Original endpoint: F(1,8) = 9.14, p = 0.017. Residual endpoint: F(1,8) = 3.21, p = 0.111.</text>
<line x1="245" y1="708" x2="1300" y2="708" class="axis"/>
<line x1="245" y1="610" x2="245" y2="708" class="axis"/>
<line x1="245" y1="708" x2="1300" y2="708" class="grid"/><text x="228" y="713" text-anchor="end" class="tick">0.00</text>
<line x1="245" y1="670" x2="1300" y2="670" class="grid"/><text x="228" y="675" text-anchor="end" class="tick">0.05</text>
<line x1="245" y1="632" x2="1300" y2="632" class="grid"/><text x="228" y="637" text-anchor="end" class="tick">0.10</text>
<line x1="245" y1="670" x2="1300" y2="670" class="ref"/><text x="1305" y="665" class="small" fill="#8b1f2d">p = 0.05</text>
<text x="105" y="658" transform="rotate(-90 105,658)" class="label">ANOVA p-value for position term</text>
<text x="773" y="777" text-anchor="middle" class="label">Pressure endpoint</text>
<rect x="450" y="695" width="280" height="13" rx="7" class="c50t bar"/><text x="590" y="687" text-anchor="middle" class="tick">p = 0.017</text><text x="590" y="732" text-anchor="middle" class="tick">Original peak endpoint</text>
<rect x="840" y="624" width="280" height="84" rx="18" class="c19t bar"/><text x="980" y="616" text-anchor="middle" class="tick">p = 0.111</text><text x="980" y="732" text-anchor="middle" class="tick">Residual peak endpoint</text>

<!-- Panel C box -->
<rect x="50" y="825" width="1400" height="245" class="box"/>
<text x="85" y="865" class="panel">(C) Leave-one-out sensitivity of the original peak-position endpoint</text>
<text x="85" y="1040" class="small">Leave-one-out p-values ranged from 0.0007 to 0.0511; one omitted-sensor case crossed the p = 0.05 reference line.</text>
<line x1="260" y1="1010" x2="1300" y2="1010" class="axis"/>
<line x1="260" y1="888" x2="260" y2="1010" class="axis"/>
<line x1="260" y1="888" x2="260" y2="1010" class="grid"/><text x="260" y="1030" text-anchor="middle" class="tick">0.00</text>
<line x1="607" y1="888" x2="607" y2="1010" class="grid"/><text x="607" y="1030" text-anchor="middle" class="tick">0.02</text>
<line x1="953" y1="888" x2="953" y2="1010" class="grid"/><text x="953" y="1030" text-anchor="middle" class="tick">0.04</text>
<line x1="1300" y1="888" x2="1300" y2="1010" class="grid"/><text x="1300" y="1030" text-anchor="middle" class="tick">0.06</text>
<line x1="1127" y1="888" x2="1127" y2="1010" class="ref"/><text x="1135" y="902" class="small" fill="#8b1f2d">p = 0.05</text>
<text x="115" y="957" transform="rotate(-90 115,957)" class="label">Omitted sensor</text>
<text x="780" y="1062" text-anchor="middle" class="label">Leave-one-out p-value</text>
<text x="245" y="904" text-anchor="end" class="tick">omit V56</text><circle cx="272" cy="900" r="6" class="c50b dot"/>
<text x="245" y="915" text-anchor="end" class="tick">omit V71</text><circle cx="419" cy="911" r="6" class="c50t dot"/>
<text x="245" y="926" text-anchor="end" class="tick">omit V58</text><circle cx="685" cy="922" r="6" class="c19t dot"/>
<text x="245" y="937" text-anchor="end" class="tick">omit V59</text><circle cx="758" cy="933" r="6" class="c19b dot"/>
<text x="245" y="948" text-anchor="end" class="tick">omit V57</text><circle cx="844" cy="944" r="6" class="c19t dot"/>
<text x="245" y="959" text-anchor="end" class="tick">omit V55</text><circle cx="847" cy="955" r="6" class="c19t dot"/>
<text x="245" y="970" text-anchor="end" class="tick">omit V50</text><circle cx="848" cy="966" r="6" class="c50t dot"/>
<text x="245" y="981" text-anchor="end" class="tick">omit V53</text><circle cx="940" cy="977" r="6" class="c50t dot"/>
<text x="245" y="992" text-anchor="end" class="tick">omit V52</text><circle cx="949" cy="988" r="6" class="c50b dot"/>
<text x="245" y="1003" text-anchor="end" class="tick">omit V70</text><circle cx="955" cy="999" r="6" class="c50b dot"/>
<text x="245" y="1014" text-anchor="end" class="tick">omit V51</text><circle cx="1145" cy="1010" r="6" class="c19b dot"/>

<text x="45" y="1100" class="small">Supplementary diagnostic only. No external barometric correction was applied because absolute trial dates were not recoverable from the study records.</text>

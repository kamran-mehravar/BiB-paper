<text x="58" y="38" class="title">Supplementary Figure S1. Common-mode diagnostic for the main-trial pressure endpoint</text>
<text x="58" y="66" class="sub">C19/C50 are chamber set-point labels. The analysis uses the original main-trial sensor records; no external barometric record was available.</text>
